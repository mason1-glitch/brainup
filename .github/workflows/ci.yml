# Prüft jeden Push und jeden Pull Request (Tests, Build, E2E) und veröffentlicht main auf GitHub Pages.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, Build, E2E
    runs-on: ubuntu-latest
    # Das iPhone-Profil braucht inzwischen gut eine Viertelstunde.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps webkit
      # Baut selbst (Typprüfung + Produktions-Build) und spielt gegen `vite preview`; nur das iPhone-Profil.
      - run: npx playwright test --project=iphone
      - name: Playwright-Bericht bei Fehlern
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results
          retention-days: 7
      # Genau der getestete Build wird veröffentlicht.
      - name: Build für Pages ablegen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Pixel-Profil (Chromium) parallel zum Job `test`.
  pixel:
    name: E2E Pixel (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=pixel
      - name: Playwright-Bericht bei Fehlern
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-pixel
          path: test-results
          retention-days: 7

  # Lighthouse gegen den Produktions-Build; alle vier Kategorien müssen mindestens 0,95 erreichen.
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --yes @lhci/cli@0.15 autorun
      - name: Lighthouse-Berichte bei Fehlern
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 7

  deploy:
    name: Deploy auf GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, pixel, lighthouse]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
